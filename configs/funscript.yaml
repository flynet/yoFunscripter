# Пороги генерации .funscript. Единственный источник чисел: скрипты читают только отсюда.
# Все размеры — в пикселях уменьшенного кадра (ширина = width).

width: 1000            # ширина кадра после уменьшения; высота по пропорциям
weights: models/best.pt   # бандль models/best.pt: резолвер `model_path` ищет его в ресурсах сборки
imgsz: 640             # инференс: 41.1 мс/кадр при 1024, ~15-20 мс при 640 (замер на RTX 4060)
conf: 0.20             # порог уверенности детекции. A/B на 60% и 20% (sexy-s002, sexy-s005):
                       # s002 313 тика / max gap 560 при 0.60 и 305 / 760 при 0.20;
                       # s005 (пропажи трека) 32 тика и один разрыв 880 мс при 0.60 и 36 тика,
                       # разрывов > 800 мс нет при 0.20. Низкий порог держит трек живым через
                       # пропажу, ложные треки режет гейт weak_detections (det/update ratio)
detect_every: 25       # YOLO-коррекция каждый N-й кадр (25 fps -> 1 секунда). Раньше
                       # detect_every 3 (120 мс) контроль был чаще движения и давал ступеньку
                       # центра; при 300 мс бокс устаревал. Теперь LK-трекер первичен: он
                       # сам ведёт точки каждый кадр, YOLO лишь коррегирует бокс раз в
                       # секунду (замер sexy-s005: coverage 0.438 и провалы на
                       # YOLO-коррекции каждые 120 мс)

iou_gate: 0.30         # IoU детекции к боксу трека: совпало -> обновление бокса
adopt_gain: 0.50       # центр тянется к детекции этой долей разницы, а не телепортируется:
                       # разница LK-центра и детекции (до loss_drift долей = 80 px при боксе
                       # 200 px) = ступенька в ряду позиций, парабола экстремума получает
                       # время ступеньки, а не движения
kalman_pos_gain: 0.70  # доля, которой Kalman-центр cx тянется к сырому LK-центру raw:
                       # LK-джиттер 1 px на гладкой коже = волна после локальной нормировки
                       # амплитуды (замер sexy-s020: A 1.7 px, 57 волн на статичной картинке)
kalman_vel_gain: 0.25  # доля сырой LK-скорости в оценке скорости; коастинг едет по этой
                       # скорости через пропажу, темп волны не обрывается
kalman_min_good: 2     # минимум good-точек, чтобы LK-измерение принималось фильтром
resume_center_tol: 0.40  # возобновление потерянного трека: центр детекции ближе этой доли
                       # размера к эталонному боксу -> тот же track_id. По IoU 0.30 к эталону
                       # цепочка cls1 рвалась (sexy-s002: 2 -> 6 -> 3 -> 7 -> 2), и coverage
                       # каждого куска мерялась по всему клипу

seed_points: 10        # сетка seed_points x seed_points точек LK внутри бокса. A/B замер
                       # (8 клипов video_source): coverage 0.693, waves kept-клипов
                       # 4+4+4=12 против 4+4+3=11 при 5x5; доля плато 0 %, время прогона
                       # те же 4-9 с/клип. 5x5 (25 точек) давало coverage 0.640
seed_margin: 0.15      # отступ от краёв бокса, доля размера
reseed_every_frames: 1 # LK-пересев каждый кадр: forward-backward LK (`lk_fb_tol_px 2`)
                       # на гладкой коже теряет точки сразу (sexy-s005: good 100 -> 44 -> 24
                       # за один кадр, loss_good_ratio 0.50 резал трек), свежий посев по
                       # углам Shi-Tomasi внутри текущего бокса держит визуальный трекер
                       # живым, не дожидаясь YOLO
reseed_good_ratio: 0.60 # пересевать, когда good ниже этой доли засеванных
reseed_min_points: 8   # и не меньше этого числа точек
reseed_quality: 0.01   # qualityLevel goodFeaturesToTrack
reseed_min_dist: 8     # minDistance goodFeaturesToTrack, px уменьшенного кадра
lk_win: 21             # calcOpticalFlowPyrLK winSize (lk_win x lk_win)
lk_level: 3            # пирамида
lk_fb_tol_px: 2        # forward-backward LK: второй вызов назад (next -> prev), точка good
                       # только при возврате в исходную позицию с ошибкой <= порога. Прямой
                       # LK принимает точку, перепрыгнувшую на соседний объект; на гладкой
                       # коже точечный дрейф накапливается. 0 = выключено (стоимость вдвое:
                       # 8.8 мс на 25 точек на вызов)

loss_good_ratio: 0.50  # good-точек меньше доли от засеванных -> потеря
loss_drift: 1.15       # дрейф центра от эталонного бокса, доля размера -> потеря.
                       # LK первичен: YOLO подтверждает бокс раз в секунду, полный ход
                       # сигнала уносит Kalman-центр за 100+ px до следующей коррекции
                       # (sexy-s005 drift 0.44, sexy-s002 14400 drift 1.001: трек умирал
                       # за кадр до YOLO, coverage рвался и появлялась яма). Порог
                       # 1.15 разрешает ход на бокс и чуть дальше; coast_max_ms и
                       # IoU-матчинг режут угон на чужой объект, а не размерный порог.
loss_drift_px: 0       # дрейф центра в пикселях (по худшей оси) -> потеря; 0 = выключен.
                       # Доля размера мягче на малых боксах: 0.40 при боксе 60 px = 24 px
                       # дрейфа, при 200 px = 80 px. Абсолютный порог одинаков для всех
                       # боксов и отсекает дрейф там, где доля не срабатывает
coast_max_ms: 2400     # потеря без подтверждения детекцией (коастинг): трек едет по
                       # Kalman-скорости, детекция его не видела. При YOLO раз в 1 с это
                       # две пропущенные коррекции (2 с + запас): живые по LK точки
                       # continue вести, coverage и темп не обрываются на одну пропажу
                       # (sexy-s002: у 34 потерь good = 100,99,95..., LK держал точки)

grid_ms: 20            # сетка артефактов (signal.csv). Сигнал считается по нативным кадрам:
                       # интерполяция на 20 мс давала тикам квант сетки вместо измерения
smooth_ms: 100         # верхняя граница медианного фильтра. Окно = min(smooth_ms, половина
                       # локального периода): 100 мс при медианном полупериоде сигнала 160 мс
                       # срезает пики и сдвигает время тика
detrend_window_ms: 1000  # скользящая медиана: убирает панораму камеры и общее движение тела

fusion_window_ms: 2000 # окно локальной амплитуды трекера (вес в фьюзе) и окно локальной
                       # амплитуды консенсуса (порог prominence)
min_local_points: 6    # живых точек в окне, чтобы локальная амплитуда имела смысл
tick_support_ms: 100   # окно подтверждения тика: экстремум трекера того же знака рядом
min_tick_support: 2    # тик остаётся, если его подтверждают >= N трекеров. Треки в клипе
                       # движутся в одну сторону (замер sexy-s002: cls0 x cls1 корреляция
                       # +0.82 на нулевом лаге, +0.73 при лаге 80 мс), согласие = уверенность тика.
                       # Замер sexy-s002: 292 тика, support>=2 = 202 (0.69), support>=1
                       # покрытие консенсуса 0.994; тики с поддержкой 0 (усреднение двух
                       # трекеров) в разрывы не ставятся
min_tick_support_ratio: 0.5  # доля тиков с поддержкой >= min_tick_support; ниже — сигнал
                       # держится одним трекером (LK-джиттер), тики фантомные
phase_fill: false      # разрывы фазовыми тиками. Замер sexy-s002: 172 тика, из них 138
                       # phase и 32 измеренных — сетка 400 мс (медианный интервал cls0-трека)
                       # по всему клипу, waves 85 при 16 реальных волнах. Разрыв = плато
project: true          # проекция разрывов: где консенсус без поддержки (трекеры потеряны),
                       # волна продлевается по фазе последнего цикла до нового обнаружения,
                       # и темп через пропажу тот же. Замер sexy-s005: 13 разрывов 5.96 с из
                       # 10.36 с (1640 и 1280 мс) = яма на графике и плато скрипта. Фаза и
                       # амплитуда — квадриатурная подгонка [1, cos, sin] по хвосту левого
                       # сегмента, фаза догоняется до первого кадра после разрыва. Тики
                       # `kind = project` (поддержка 1 = сам консенсус), в `waves` не считаются
project_min_ms: 120    # разрыв короче не проектируется: медианный фильтр закрывает
project_win_ms: 1200   # окно подгонки фазы/амплитуды перед разрывом
project_min_periodicity: 0.30 # автокорреляция окна ниже — период не найден, фазы нет
project_fit_tol: 0.7   # rms останка подгонки <= tol * амплитуды, иначе подгонка выдумана
                       # (совпадает с 1 - project_min_periodicity: тот же гейт)
project_decay_per_s: 0.05  # амплитуда проекции падает так по секунде: волна не раздувается
project_amp_floor: 0.95    # и не ниже этой доли исходной — полный ход держится до детекции


min_amplitude_px: 10   # p95-p5 де-трененной проекции. 20 px (2% ширины) отсекал debug_4
min_stroke_units: 25   # минимальный ход устройства в единицах pos: разрыв делается пополам
                       # только если pos соседей различаются >= 25. Разрыв 48960..50760
                       # (1800 мс, размах z 0.81) делится на pos 25->9->8 = устройство стоит
                       # (амплитуда 14.0 px, периодичность 0.662, 5 экстремумов, coverage 0.99).
                       # Ложные треки отсекают min_coverage 0.50 и min_update_ratio 0.20,
                       # а не амплитуда
min_coverage: 0.50     # доля сетки с живым треком и >= loss_good_ratio good-точек
min_peaks: 3           # меньше трёх экстремумов — сигнала нет
min_update_ratio: 0.20 # доля кадров сегмента, где бокс обновлён детекцией: FP-гейт
prominence_ratio: 0.25 # экстремум значим при prominence >= ratio * амплитуды
full_stroke_ratio: 0.45 # ход (z до ближайшего экстремума противоположного знака) >= ratio
                        # медианы ходов по 5 соседним экстремумам: тик = pos 0/100. Ниже —
                        # wobble, и он не становится тиком: бинарный режим не знает
                        # промежуточных pos. Window-prominence как критерий не годится:
                        # prominence мерит высоту над контуром к более высокому соседу и
                        # занижает ход рядом с глубокой впадиной (sexy-s002: 30 из 33
                        # экстремумов с pos вне 0/100 имели ход 0.75..1.0 при prominence
                        # 0.40..0.74). 0.75 резало половины полного периода (замер
                        # sexy-s002 после Kalman: экстремумы 7100/7340 с frac 0.494,
                        # разрыв 6980..7880 900 мс); 0.45 держит полный темп без плато
min_interval_ms: 100   # floor интервала между тиками; фактический интервал
                       # = max(floor, 100 единиц / speed_limit)
pos_binary: true        # ход устройства 0 -> 100 -> 0: пик = 100, впадина = 0. Нормировка
                        # консенсуса 0..100 по клипу даёт тики в полосе 35..70 (замер
                        # sexy-s002: 56 pos, 2 тика по 0, 1 по 100) = качели в четверть
                        # диапазона, полного хода нет.
                       # диапазона, полного хода нет. Полный ход -> pos 0/100, частичный
                       # wobble -> измеренная pos (критерий полного хода — stroke fraction)
speed_limit_units_per_s: 1000  # предел скорости устройства: 100 единиц за 100 мс = 1000 ед/с,
                       # то есть каждый экстремум сигнала становится тиком. Интервал больше
                       # полупериода рвёт чередование pos (замер debug: interval 200 при
                       # периоде 320 -> pos 100->100 подряд)
autocorr_min_ms: 100   # лаги автокорреляции (периодичность)
autocorr_max_ms: 1000

# Формат .funscript.
#   modern = actionTrack + metadata (OSFF, The Handy, Funscript Sync, Lovense)
#   legacy = version/inverted/range/actions[{at,pos}] (старый Handwrester; эталон в
#           funscript/example.funscript: 46137 actions, median интервал 85 мс, min 75 мс —
#           то есть 100 мс выше conservative, при 85 мс real scripts тоже живут)
range: 100       # значение range в sidecar. Формат один: version 1.0 / inverted false /
                 # range / actions[{pos,at}]. deviceTime/actionTrack никогда

# Priority при равных скорах. Тот же порядок задаёт цвет маркера в viewer.
# Индексы классов; имена разрешаются из configs/classes.yaml (локальный, не в git)
# при загрузке конфига — load_funscript_cfg.
priority: [3, 4, 2, 1, 0]

out_dir: work/funscript    # артефакты прогона (selection.csv, ticks.csv) — внутри install dir

# --- Merge: video_source -> video_result (merge.bat, отдельный от funscript_debug.bat) ---
# Волна = пик + впадина принятого сигнала (полный цикл 0->100->0). Мера сортировки —
# волн в секунду (wave_rate), фильтр — waves >= min_waves (иначе клип без волн).
min_waves: 3           # отсечь клипы с меньшим числом полных волн
max_waves: 0           # 0 = верхнего порога нет
source_dir: scenes         # клипы stage 1 (GUI перекрывает значением из настроек)
result_dir: result         # install dir/result (GUI перекрывает)
result_name: result    # video_result/result.mp4 + result.funscript
concat_dir: work/concat     # сегменты энкода — внутри install dir, не пользовательская папка

# Энкод сегментов: все сегменты получают identical параметры кодека и timescale —
# только при этом concat demuxer (`-c copy`) считает PTS непрерывно без перекодирования.
# Источник video_source: 1920x1080 yuv420p 23.976 fps, AAC 48k stereo.
target_width: 1920
target_height: 1080
target_fps: 30
x264_crf: 18           # визуально без потерь на 1080p источнике
x264_preset: veryslow
x264_gop: 60           # 2 с при 30 fps; keyint_min тот же, sc_threshold 0 = предсказуемый GOP
audio_bitrate: 192k
audio_rate: 48000
video_track_timescale: 30000   # = target_fps * 1000, единый для всех сегментов
ffmpeg_bin: ffmpeg
ffprobe_bin: ffprobe
