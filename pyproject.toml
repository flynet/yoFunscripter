[project]
name = "yofunscripter"
version = "1.0.0"
description = "Cut videos into scenes, generate .funscript with YOLO, merge video + funscript into one media file"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "ultralytics>=8.1",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "packaging>=24.0",
    "scenedetect>=0.6.4",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.scripts]
yofunscripter = "yofunscripter.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yofunscripter"]

# The default build of torch from PyPI is the CUDA wheel: the Windows wheel is over
# 2.5 GB, and the program runs on a machine with no CUDA. The CPU wheels of the PyTorch
# index keep the installer small. `build.ps1 -Cuda` switches the venv to the cu126 index
# for a machine with the GPU.
[[tool.uv.index]]
name = "torchcpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torchcpu" }
torchvision = { index = "torchcpu" }

[dependency-groups]
# Tests of the Qt-free parts: updater, settings, catalogues, progress, selection.
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
