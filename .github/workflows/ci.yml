name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install the dependencies (CPU torch wheels)
        run: uv sync

      # The tests cover the Qt-free parts: the updater, settings, the language
      # catalogues, the progress meter, the merge selection, the layout of the
      # packaged paths. The pipelines need real video and a model, so CI does not run
      # them: the app is tested by running it.
      - name: Tests
        run: uv run pytest -q
