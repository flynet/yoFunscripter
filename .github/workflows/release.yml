name: Release build

# The installer is built on the Windows runner and attached to the release: the updater
# of the app reads `releases/latest` and looks for `YoFunscripter-Setup-<version>.exe`,
# so the file name of the build is the contract (SETUP_PREFIX in constants.py).

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.ps1 takes the version from `git describe --tags`, so the tags must be
          # in the checkout, not only the tip of the default branch
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install the dependencies (CPU torch wheels)
        run: uv sync

      - name: Build the program and the installer
        shell: pwsh
        # Inno Setup 6 is installed on the Windows runner, and FFmpeg is downloaded by
        # tools\fetch_ffmpeg.ps1 (the build ships bin\ffmpeg.exe and bin\ffprobe.exe)
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Check the imports of the frozen build
        shell: pwsh
        # torch and ultralytics are imported inside the stage functions, so PyInstaller
        # does not report them: the selftest runs the same collect_all list without Qt
        # and prints OK
        run: |
          uv run pyinstaller --clean --noconfirm tools\selftest.spec
          $exe = "dist\selftest\selftest.exe"
          if (-not (Test-Path $exe)) { throw "the selftest build is not at $exe" }
          $line = & $exe
          Write-Host $line
          if ($LASTEXITCODE -ne 0) { throw "the selftest of the frozen build failed" }

      - name: Check the file name against the release
        shell: pwsh
        run: |
          $version = (git describe --tags --abbrev=0) -replace '^v', ''
          $setup = "dist/install/YoFunscripter-Setup-$version.exe"
          if (-not (Test-Path $setup)) {
            throw "the installer is not at $setup (the updater finds only this name)"
          }
          Write-Host "installer: $setup"

      - name: Is an installer already in the release
        id: present
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The GPU machine puts its CUDA build on the release as soon as the release is
          # created, and the updater takes exactly one `YoFunscripter-Setup-<version>.exe`,
          # so the CPU build of the runner is not added on top of it.
          $rel = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$env:TAG" `
              -Headers @{ Authorization = "token $env:GH_TOKEN" }
          $setup = @($rel.assets | Where-Object { $_.name -like "YoFunscripter-Setup-*.exe" })
          "present=$($setup.Count)" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Publish the installer and its SHA-256
        if: steps.present.outputs.present == '0'
        uses: softprops/action-gh-release@v2
        with:
          # `append_by_default: false` (the default of the action) deletes the assets that
          # are already on the release, and that is the CUDA installer of the GPU machine:
          # the release must keep it, so the CPU build is appended, not written over
          append_by_default: true
          files: |
            dist/install/YoFunscripter-Setup-*.exe
            dist/install/YoFunscripter-Setup-*.exe.sha256
